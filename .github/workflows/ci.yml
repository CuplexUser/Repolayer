name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# A newer push to the same branch cancels the older run, except on main where every
# commit's result is worth keeping.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # `node:sqlite` needs --experimental-sqlite below 23.4 and is only stable from 24,
        # so 22 passes the flag. It is in the matrix because engines.node claims support
        # from 22.5, and a claim nothing runs against is a guess.
        node: ['22', '24', '26']

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: repolayer
          POSTGRES_PASSWORD: repolayer
          POSTGRES_DB: repolayer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repolayer -d repolayer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: repolayer
          MYSQL_USER: repolayer
          MYSQL_PASSWORD: repolayer
          MYSQL_DATABASE: repolayer
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -urepolayer -prepolayer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: repolayer
          MARIADB_USER: repolayer
          MARIADB_PASSWORD: repolayer
          MARIADB_DATABASE: repolayer
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      # Setting these is what un-skips each engine's half of the conformance suite. Locally
      # they are usually absent and those tests skip with a message; in CI they always run,
      # and the step after the tests fails the build if any of them did not.
      TEST_DATABASE_URL: postgres://repolayer:repolayer@localhost:5432/repolayer
      TEST_MYSQL_URL: mysql://repolayer:repolayer@127.0.0.1:3306/repolayer
      TEST_MARIADB_URL: mysql://repolayer:repolayer@127.0.0.1:3307/repolayer
      # `node:sqlite` is behind a flag before 23.4.
      NODE_OPTIONS: ${{ matrix.node == '22' && '--experimental-sqlite' || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build
        # Must precede both the lint and the typecheck: examples/ import the built package
        # from dist/ on purpose, so the examples also verify the generated .d.ts files are
        # usable. On a clean runner there is no dist/ until this step runs, and without it
        # every example resolves to `any` and the type-aware lint rules fail the build.
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test every engine
        # One run, one report. The engine assertion below reads that report rather than
        # re-running a suite, which used to cost a second full pass over the databases.
        run: npx vitest run --reporter=json --outputFile=report.json --reporter=default

      - name: Fail if any engine's conformance suite did not actually run
        run: |
          node scripts/assert-engines-ran.mjs report.json \
            test/postgres.test.ts \
            test/mysql.test.ts \
            test/mariadb.test.ts \
            test/sqlite.test.ts \
            test/memory.test.ts

      - name: Coverage
        if: matrix.node == '24'
        run: npx vitest run --coverage

      - name: Prove the driver swap produces identical output
        # The package's central claim, executed against every engine for real.
        run: npm run example:swap

      - name: Run the remaining examples
        run: |
          npm run example:stream-export
          npm run example:paging-api
          npm run example:memory-testing

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Pack and install into a scratch consumer
        # Catches export-map and type-resolution breakage that only shows up once the
        # package is installed, and confirms the SQLite path works with `pg` and `mysql2`
        # both absent.
        run: |
          set -euo pipefail
          npm pack --pack-destination /tmp
          mkdir -p /tmp/consumer && cd /tmp/consumer
          echo '{"name":"consumer","private":true,"type":"module","version":"1.0.0"}' > package.json
          npm install /tmp/repolayer-*.tgz

          cat > esm.mjs <<'EOF'
          import { createRepo, defineSchema } from 'repolayer';
          import { SqliteRepo } from 'repolayer/sqlite';
          import { MysqlRepo } from 'repolayer/mysql';
          import { MemoryRepo } from 'repolayer/memory';
          import assert from 'node:assert/strict';
          const schema = defineSchema({
            id: { type: 'string', primaryKey: true },
            name: { type: 'string' },
          });
          const repo = await createRepo({
            driver: 'sqlite', table: 't', schema,
            connection: { file: ':memory:' }, ensureTable: true,
          });
          const row = await repo.create({ name: 'esm' });
          assert.equal((await repo.findById(row.id)).name, 'esm');

          // The capabilities added since v1, exercised through the published entry points.
          const page = await repo.findPage(undefined, { limit: 10 });
          assert.equal(page.items.length, 1);
          const streamed = [];
          for await (const r of repo.stream()) streamed.push(r);
          assert.equal(streamed.length, 1);
          assert.equal(await repo.updateMany(undefined, { name: 'renamed' }), 1);

          const memory = new MemoryRepo({ table: 't', schema });
          await memory.create({ name: 'in memory' });
          assert.equal((await memory.count()), 1);

          assert.equal(typeof SqliteRepo, 'function');
          assert.equal(typeof MysqlRepo, 'function');
          await repo.close();
          console.log('ESM consumer ok');
          EOF

          cat > cjs.cjs <<'EOF'
          const assert = require('node:assert/strict');
          const { createRepo, defineSchema } = require('repolayer');
          const schema = defineSchema({
            id: { type: 'string', primaryKey: true },
            name: { type: 'string' },
          });
          createRepo({
            driver: 'sqlite', table: 't', schema,
            connection: { file: ':memory:' }, ensureTable: true,
          }).then(async (repo) => {
            const row = await repo.create({ name: 'cjs' });
            assert.equal((await repo.findById(row.id)).name, 'cjs');
            await repo.close();
            console.log('CJS consumer ok');
          }).catch((e) => { console.error(e); process.exit(1); });
          EOF

          node esm.mjs
          node cjs.cjs

      - name: Upload the tarball
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: /tmp/repolayer-*.tgz
